server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para reducir tamaño de transferencia
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/html
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff2;

    # Servir archivos estáticos; intentar el archivo exacto, luego como dir, luego 404
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache agresivo para assets con hash en el nombre (MkDocs los versiona)
    location ~* \.(css|js|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache moderado para imágenes y SVGs
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Sin cache para HTML (permite actualizar el sitio sin problemas)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Página de error personalizada
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
